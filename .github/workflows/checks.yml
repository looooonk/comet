name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -m "not gpu and not appworld"
      - run: |
          for script in scripts/*.sh infra/slurm/*.sh infra/gcp/*.sh; do
            bash -n "$script"
          done
