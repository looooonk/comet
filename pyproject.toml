[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comet-research"
version = "0.1.0"
description = "Budget-matched agent KV recovery experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
comet = "comet.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "gpu: requires a CUDA GPU and the pinned engine environment",
    "appworld: requires the installed AppWorld bundle and data",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
